# Ubuntu container and setup entry point
UBUNTU_IMAGE=ubuntu:24.04
UBUNTU_CONTAINER_NAME=docker-k8s-ubuntu
UBUNTU_SETUP_FILE_NAME=ubuntu_setup.sh
UBUNTU_CONTAINER_SCRIPTS_PATH=/opt/docker-k8s-setup
DOCKER_SOCKET_PATH=/var/run/docker.sock

# kind and Kubernetes node image
KIND_VERSION=latest
KIND_NODE_VERSION=v1.34.0

# Linkwise UI image and published port
LINKWISE_IMAGE_NAME=nidznd/linkwise-ui
LINKWISE_IMAGE_TAG=latest
LINKWISE_CONTAINER_NAME=docker-k8s-linkwise-ui
LINKWISE_HOST_PORT=5000
LINKWISE_CONTAINER_PORT=80

# Linkwise UI source build stack versions (package-lock.json)
APP_NODE_VERSION=24.12.0
APP_REACT_VERSION=19.3.0
APP_VITE_VERSION=8.3.4
APP_REACT_PLUGIN_VERSION=6.1.2
APP_FIREBASE_APP_VERSION=0.16.3
APP_FIREBASE_AUTH_VERSION=1.13.7